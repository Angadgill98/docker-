[package]
name = "docker"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"


dotenvy = "0.15"


tokio = { version = "1", features = ["full"] }
rtnetlink = "0.14"
futures = "0.3"


serde = { version = "1", features = ["derive"] }
serde_json = "1"

ipnetwork = "0.21"


flate2 = "1"
tar = "0.4"